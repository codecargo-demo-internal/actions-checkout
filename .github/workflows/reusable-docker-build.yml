name: Reusable Docker Build

on:
  workflow_call:
    inputs:
      dockerfile:
        description: 'Path to the Dockerfile'
        required: false
        default: 'Dockerfile'
        type: string
      context:
        description: 'Build context directory'
        required: false
        default: '.'
        type: string
      image-name:
        description: 'Docker image name (e.g., myapp, ghcr.io/org/myapp)'
        required: true
        type: string
      image-tag:
        description: 'Docker image tag (e.g., v1.0.0, latest, or commit SHA)'
        required: false
        default: 'latest'
        type: string
      registry:
        description: 'Docker registry (e.g., docker.io, ghcr.io). Ignored if image-name includes registry.'
        required: false
        default: 'docker.io'
        type: string
      push:
        description: 'Push image to registry'
        required: false
        default: false
        type: boolean
      build-args:
        description: 'Build arguments (comma-separated key=value pairs, e.g., VERSION=1.0,ENV=prod)'
        required: false
        default: ''
        type: string
    secrets:
      registry-username:
        description: 'Docker registry username'
        required: false
      registry-password:
        description: 'Docker registry password or token'
        required: false
    outputs:
      image-digest:
        description: 'Docker image digest'
        value: ${{ jobs.build.outputs.digest }}
      image-uri:
        description: 'Full Docker image URI'
        value: ${{ jobs.build.outputs.uri }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      uri: ${{ steps.output.outputs.uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        if: inputs.push && env.REGISTRY_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}
        env:
          REGISTRY_USERNAME: ${{ secrets.registry-username }}
          REGISTRY_PASSWORD: ${{ secrets.registry-password }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: |
            ${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
            ${{ inputs.registry }}/${{ inputs.image-name }}:latest
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set output values
        id: output
        run: |
          echo "uri=${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}" >> "$GITHUB_OUTPUT"
          echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
